[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indie-talent-scout"
version = "0.1.0"
description = "Autonomous creative talent and subculture scouting engine for India using Exa AI neural search."
readme = "README.md"
authors = [{ name = "Sriram Kintada", email = "kintadasrirama3637f@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["exa", "ai", "talent-scout", "music-discovery", "designers", "india", "indie-creators"]
requires-python = ">=3.9"
dependencies = [
    "exa-py>=1.8.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/SriramKintada/indie-talent-scout"
Repository = "https://github.com/SriramKintada/indie-talent-scout"
Issues = "https://github.com/SriramKintada/indie-talent-scout/issues"

[project.scripts]
indie-talent-scout = "indie_talent_scout.cli:main"
